addr: "host.docker.internal"
port: 8000
record_prefix: "slurm"
job_filter:
  status:  # A list of acceptable job statuses
    - "completed"
sacct_frequency: 2 # in seconds
sender_frequency: 1 # in seconds
sites:
  - name: "site_id_1"
    only_if:
      key: "Partition"
      matches: "^part1$"
  - name: "site_id_2"
    only_if:
      key: "Partition"
      matches: "^part2$"
meta:
  - name: Comment
    key: "Comment"
    key_type: Json
components:
  - name: "Cores"
    key: "NCPUS"
    scores:
      - name: "hepspec23"
        value: 10
        only_if:
          key: "Partition"
          matches: "^part1$"
      - name: "hepspec23"
        value: 12
        only_if:
          key: "Partition"
          matches: "^part2$"
  - name: "SystemCPU"
    key: "SystemCPU"
    key_type: Time
    only_if:
      key: "Partition"
      matches: "^part1$"
  - name: "UserCPU"
    key: "UserCPU"
    key_type: Time
    only_if:
      key: "Partition"
      matches: "^part1$"
  - name: "Memory"
    key: "ReqMem"
    key_type: IntegerMega
tls_config:
  use_tls: false
